# Полный пайплайн: сборка React → деплой docker-образа web на свой сервер
# (когда заведён DEPLOY_SSH_KEY) → деплой в Object Storage (до реза на
# my-finance.site) → зеркало репозитория в GitHub.

stages:
  - build
  - deploy

variables:
  # Общие переменные для всех джоб (не секретные)
  NODE_IMAGE: node:20-alpine
  AWS_CLI_IMAGE: amazon/aws-cli:latest

# ─────────────────────────────────────────────────────────────
# Этап 1: Сборка React-приложения
# ─────────────────────────────────────────────────────────────
build:
  stage: build
  image: $NODE_IMAGE
  before_script:
    - npm ci
    # Генерируем .env из переменных GitLab CI/CD, чтобы значения попали в бандл на этапе сборки.
    # Ключи НЕ лежат в репозитории — они заданы в Settings → CI/CD → Variables.
    - echo "SUPABASE_URL=$SUPABASE_URL" > .env
    - echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
    # Проверка, что файл создан (для отладки; секреты не печатаем)
    - cat .env | sed 's/=.*/=***/'
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - develop

# ─────────────────────────────────────────────────────────────
# Этап 2: Деплой в Object Storage
# ─────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image:
    name: $AWS_CLI_IMAGE
    entrypoint: ['']
  dependencies:
    - build
  before_script:
    # Генерируем .env из переменных GitLab CI/CD.
    # Ключи НЕ лежат в репозитории — они заданы в Settings → CI/CD → Variables.
    - echo "SUPABASE_URL=$SUPABASE_URL" > .env
    - echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
    # Проверка, что файл создан (для отладки; секреты не печатаем)
    - cat .env | sed 's/=.*/=***/'
  script:
    # Настройка AWS CLI на Yandex Object Storage
    - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set default.region ru-central1
    # Синхронизация собранной статики в бакет
    - aws --endpoint-url=https://storage.yandexcloud.net s3 sync dist/ s3://$BUCKET_NAME --delete
  only:
    - develop

# ─────────────────────────────────────────────────────────────
# Этап 3: Деплой web на свой сервер (docker compose, сервис web)
# Джоба создаётся только после заведения DEPLOY_SSH_KEY в Variables —
# до этого пайплайн работает как раньше (OSS остаётся продом).
# На сервере: hard-reset клона client на origin/develop и пересборка
# ТОЛЬКО web из общего стека /opt/mybudget/server (api и db не трогаются).
# ─────────────────────────────────────────────────────────────
deploy-web:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $DEPLOY_SSH_KEY'
  timeout: 15m
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # tr -d '\r' — страховка от CRLF при вставке ключа в веб-форму GitLab
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd /opt/mybudget/client
      && git fetch origin develop
      && git checkout develop
      && git reset --hard origin/develop
      && cd /opt/mybudget/server
      && docker compose up -d --build web"

# ─────────────────────────────────────────────────────────────
# Этап 4: Копирование репозитория в gitHub
# ─────────────────────────────────────────────────────────────
mirror-to-github:
  stage: deploy
  only:
    - develop
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git remote add github git@github.com:VladAvseev/my-budget.git
  script:
    - git push github "HEAD:refs/heads/${CI_COMMIT_REF_NAME}"
