# Пайплайн: сборка React → деплой web-образа → зеркало в GitHub.

stages:
  - build
  - deploy

variables:
  # Общие несекретные переменные
  NODE_IMAGE: node:20-alpine

# Этап 1: сборка (секретов в бандле нет, env не генерируется)
build:
  stage: build
  image: $NODE_IMAGE
  before_script:
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - develop

# Этап 2: деплой web (только после DEPLOY_SSH_KEY; api и db не трогаются)
deploy-web:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $DEPLOY_SSH_KEY'
  timeout: 15m
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # CRLF-страховка ключа из веб-формы GitLab
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd /opt/mybudget/client
      && git fetch origin develop
      && git checkout develop
      && git reset --hard origin/develop
      && cd /opt/mybudget/server
      && docker compose up -d --build web"

# Этап 3: зеркало в GitHub
mirror-to-github:
  stage: deploy
  only:
    - develop
  variables:
    # Shallow-клон ломает push (thin-pack) — нужен полный (GIT_DEPTH: 0)
    GIT_DEPTH: 0
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git remote add github git@github.com:VladAvseev/my-budget.git
  script:
    # Зеркало однонаправленное (--force) и самодостаточное (--no-thin)
    - git push --no-thin --force github "HEAD:refs/heads/${CI_COMMIT_REF_NAME}"
