# nginx внутри web-контейнера: раздача SPA и реверс-прокси /api/ на бэкенд.
# TLS терминируется снаружи (хостовый nginx + certbot), поэтому здесь HTTP:80.
# Файл заменяет дефолтный /etc/nginx/conf.d/default.conf в nginx-образе.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security-заголовки: токены хранятся в localStorage, поэтому CSP —
    # основная защита от XSS-инъекций скриптов. 'unsafe-inline' в style-src
    # нужен из-за инлайновых стилей сборки; script-src инлайна не разрешает.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
        always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Сжатие текстовых ресурсов (статика rsbuild уже с хешами в именах).
    # gzip_static отдаёт готовые .gz-файлы из сборки (compression-webpack-plugin)
    # без сжатия на каждый запрос; динамический gzip — fallback для файлов,
    # где .gz не был создан (например, файлы меньше threshold).
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Адрес api:5001 резолвим через Docker DNS на каждый запрос (resolver +
    # переменная в proxy_pass): после restart'а контейнера api nginx подхватит
    # его новый IP сам, вместо 502 до собственной перезагрузки.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:5001;

    # Бэкенд слушает /api/v1/... под тем же путём — переписывать ничего не нужно
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Версионированные ассеты (хеш в имени файла) — год и immutable:
    # новый деплой меняет хеш, кэш сам сбрасывается
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: любой неизвестный путь отдаём index.html — маршруты решает react-router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
