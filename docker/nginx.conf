# SPA + реверс-прокси /api/ на бэкенд. TLS снаружи, здесь HTTP:80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSP — основная защита от XSS (токены в localStorage).
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
        always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip_static отдаёт готовые .gz; динамический gzip — fallback без .gz.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # api через Docker DNS на каждый запрос: переживает restart без 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:5001;

    # Путь /api/v1/ совпадает — rewrite не нужен
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ассеты с хешем — immutable на год (новый деплой меняет хеш).
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-фолбэк: неизвестные пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
